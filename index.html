<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f6f1ff" />
    <title>赛事评审体验｜知径 AI</title>
    <meta
      name="description"
      content="知径 AI 儿童写作引导赛事评审体验入口"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop stop-color='%231dbcf3'/%3E%3Cstop offset='1' stop-color='%238255f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M18 38c12-2 19-10 27-23-1 14-7 27-22 34l-8 1 3-12Z' fill='white'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>
  </head>
  <body>
    <div class="page-bg" aria-hidden="true"></div>
    <main class="experience-shell">
      <section class="content-column" aria-labelledby="main-title">
        <header class="brand" aria-label="知径 AI WritePath AI">
          <img src="./assets/brand-mark.png" alt="" width="72" height="78" />
          <div class="brand-copy">
            <div class="brand-name"><span>知径</span> <b>AI</b><i>✦</i></div>
            <div class="brand-en">WritePath AI</div>
          </div>
        </header>

        <div class="hero-copy">
          <p class="visual-tagline">一站式写作起点</p>
          <h1 id="main-title">问答之外</h1>
          <p class="hero-en">Beyond Answers</p>
          <p class="hero-promise">怎么处理AI辅助学习与替代学习之间的边界问题？</p>
          <p class="hero-detail">从生活出发，练习观察、构思与表达</p>
        </div>

        <section class="login-card" aria-labelledby="login-title">
          <div class="card-heading">
            <span class="lock-badge" aria-hidden="true">
              <svg viewBox="0 0 24 24">
                <path d="M7.8 10V7.7a4.2 4.2 0 0 1 8.4 0V10" />
                <rect x="5.5" y="10" width="13" height="10" rx="2.6" />
                <path d="M12 14v2.4" />
              </svg>
            </span>
            <div>
              <h2 id="login-title">赛事评审体验</h2>
              <p>本次展示为 Axure 高保真原型，请按提示点击体验</p>
            </div>
          </div>

          <form id="login-form" novalidate>
            <label for="password">访问密码</label>
            <div class="password-wrap">
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                autocapitalize="none"
                spellcheck="false"
                required
                aria-describedby="form-message"
                placeholder="请输入访问密码"
              />
              <button
                class="visibility-toggle"
                id="visibility-toggle"
                type="button"
                aria-label="显示密码"
                aria-pressed="false"
              >
                <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M2.8 12s3.3-5 9.2-5 9.2 5 9.2 5-3.3 5-9.2 5-9.2-5-9.2-5Z" />
                  <circle cx="12" cy="12" r="2.3" />
                </svg>
                <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m4 4 16 16M10.7 7.1A9.4 9.4 0 0 1 12 7c5.9 0 9.2 5 9.2 5a15 15 0 0 1-2.4 2.8M6.1 6.8C4 8.2 2.8 12 2.8 12s3.3 5 9.2 5c1.1 0 2.1-.2 3-.5" />
                </svg>
              </button>
            </div>
            <p id="form-message" class="form-message" role="status" aria-live="polite"></p>
            <button class="submit-button" id="submit-button" type="submit">
              <span>进入体验</span>
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M5 12h13M14 7l5 5-5 5" />
              </svg>
            </button>
          </form>

          <div class="backup-row">
            <span aria-hidden="true"></span>
            <a id="backup-link" href="#" target="_blank" rel="noopener noreferrer">
              访问遇到问题？<strong>使用备用体验入口</strong>
              <b aria-hidden="true">›</b>
            </a>
            <span aria-hidden="true"></span>
          </div>
        </section>
      </section>

      <section class="visual-column" aria-label="知径 AI 写作伙伴形象">
        <img class="astronaut" src="./assets/astronaut.png" alt="拿着铅笔和记事本的小宇航员" />
      </section>
    </main>

    <footer class="site-footer">
      <p><span></span>知径 AI —— 儿童写作引导体验设计<span></span></p>
      <small>建议使用 Chrome / Edge 浏览器访问</small>
    </footer>
  </body>
</html>
